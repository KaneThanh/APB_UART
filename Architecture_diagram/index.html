<script>
const page=document.getElementById('page'),picture=document.getElementById('image'),zoom=document.getElementById('zoom'),canvas=document.getElementById('canvas');let nativeWidth=2300;
function scale(){picture.style.width=Math.round(nativeWidth*zoom.value/100)+'px';document.getElementById('percent').textContent=zoom.value+'%'}
function fit(){zoom.value=Math.max(20,Math.min(180,Math.floor((canvas.clientWidth-48)/nativeWidth*100)));scale()}
